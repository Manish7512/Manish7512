<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#020617"/>
      <stop offset="0.42" stop-color="#0F172A"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="pulse" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .kernel { animation: kernelPulse 3.2s ease-in-out infinite; transform-origin: center; }
      .kernel:nth-of-type(2n) { animation-delay: .35s; }
      .kernel:nth-of-type(3n) { animation-delay: .7s; }
      .node { filter: url(#glow); }
      .line { stroke-dasharray: 10 16; animation: dash 6s linear infinite; }
      .line.fast { animation-duration: 4s; }
      .float-a { animation: floatA 7s ease-in-out infinite; }
      .float-b { animation: floatB 8s ease-in-out infinite; }
      .float-c { animation: floatC 6s ease-in-out infinite; }
      .title { animation: titleGlow 3s ease-in-out infinite; }
      .subtitle { animation: fadeIn 2.4s ease-in-out infinite alternate; }
      @keyframes dash { to { stroke-dashoffset: -104; } }
      @keyframes kernelPulse { 0%, 100% { opacity: .34; transform: scale(1); } 50% { opacity: .95; transform: scale(1.08); } }
      @keyframes floatA { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(12px, -10px); } }
      @keyframes floatB { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(-10px, 14px); } }
      @keyframes floatC { 0%, 100% { transform: translate(0, 0); } 50% { transform: translate(8px, 8px); } }
      @keyframes titleGlow { 0%, 100% { opacity: 0.92; } 50% { opacity: 1; } }
      @keyframes fadeIn { from { opacity: 0.72; } to { opacity: 1; } }
    </style>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#pulse)" opacity="0.45"/>

  <g opacity="0.25">
    <path d="M0 70H1200M0 140H1200M0 210H1200M0 280H1200M0 350H1200" stroke="#38BDF8"/>
    <path d="M100 0V420M220 0V420M340 0V420M460 0V420M580 0V420M700 0V420M820 0V420M940 0V420M1060 0V420" stroke="#818CF8"/>
  </g>

  <g transform="translate(708 42)" opacity="0.72">
    <rect class="kernel" x="0" y="0" width="34" height="34" rx="8" fill="#38BDF8"/>
    <rect class="kernel" x="42" y="0" width="34" height="34" rx="8" fill="#A78BFA"/>
    <rect class="kernel" x="84" y="0" width="34" height="34" rx="8" fill="#22C55E"/>
    <rect class="kernel" x="0" y="42" width="34" height="34" rx="8" fill="#F59E0B"/>
    <rect class="kernel" x="42" y="42" width="34" height="34" rx="8" fill="#00E5FF"/>
    <rect class="kernel" x="84" y="42" width="34" height="34" rx="8" fill="#A78BFA"/>
    <rect class="kernel" x="0" y="84" width="34" height="34" rx="8" fill="#22C55E"/>
    <rect class="kernel" x="42" y="84" width="34" height="34" rx="8" fill="#38BDF8"/>
    <rect class="kernel" x="84" y="84" width="34" height="34" rx="8" fill="#F59E0B"/>
  </g>

  <g transform="translate(980 250)" opacity="0.72">
    <rect class="kernel" x="0" y="0" width="24" height="24" rx="6" fill="#38BDF8"/>
    <rect class="kernel" x="32" y="0" width="24" height="24" rx="6" fill="#A78BFA"/>
    <rect class="kernel" x="64" y="0" width="24" height="24" rx="6" fill="#22C55E"/>
    <rect class="kernel" x="0" y="32" width="24" height="24" rx="6" fill="#F59E0B"/>
    <rect class="kernel" x="32" y="32" width="24" height="24" rx="6" fill="#00E5FF"/>
    <rect class="kernel" x="64" y="32" width="24" height="24" rx="6" fill="#A78BFA"/>
    <rect class="kernel" x="0" y="64" width="24" height="24" rx="6" fill="#22C55E"/>
    <rect class="kernel" x="32" y="64" width="24" height="24" rx="6" fill="#38BDF8"/>
    <rect class="kernel" x="64" y="64" width="24" height="24" rx="6" fill="#F59E0B"/>
  </g>

  <g opacity="0.9">
    <g class="float-a">
      <line class="line fast" x1="790" y1="82" x2="910" y2="134" stroke="#22D3EE" stroke-width="2.5"/>
      <line class="line" x1="910" y1="134" x2="1032" y2="85" stroke="#A78BFA" stroke-width="2.5"/>
      <line class="line fast" x1="910" y1="134" x2="1068" y2="226" stroke="#22C55E" stroke-width="2.5"/>
      <line class="line" x1="790" y1="82" x2="835" y2="260" stroke="#38BDF8" stroke-width="2.5"/>
    </g>
    <g class="float-b">
      <line class="line" x1="750" y1="315" x2="835" y2="260" stroke="#F59E0B" stroke-width="2.5"/>
      <line class="line fast" x1="835" y1="260" x2="985" y2="310" stroke="#22D3EE" stroke-width="2.5"/>
      <line class="line" x1="985" y1="310" x2="1068" y2="226" stroke="#A78BFA" stroke-width="2.5"/>
      <line class="line fast" x1="1032" y1="85" x2="1068" y2="226" stroke="#38BDF8" stroke-width="2.5"/>
    </g>
    <g class="float-c">
      <line class="line" x1="650" y1="165" x2="790" y2="82" stroke="#22C55E" stroke-width="2.5"/>
      <line class="line fast" x1="650" y1="165" x2="835" y2="260" stroke="#38BDF8" stroke-width="2.5"/>
      <line class="line" x1="650" y1="165" x2="750" y2="315" stroke="#A78BFA" stroke-width="2.5"/>
    </g>

    <g class="node float-a">
      <circle cx="790" cy="82" r="11" fill="#22D3EE"/>
      <circle cx="910" cy="134" r="9" fill="#A78BFA"/>
      <circle cx="1032" cy="85" r="12" fill="#38BDF8"/>
    </g>
    <g class="node float-b">
      <circle cx="650" cy="165" r="10" fill="#22C55E"/>
      <circle cx="835" cy="260" r="13" fill="#F59E0B"/>
      <circle cx="1068" cy="226" r="10" fill="#22D3EE"/>
    </g>
    <g class="node float-c">
      <circle cx="750" cy="315" r="9" fill="#A78BFA"/>
      <circle cx="985" cy="310" r="12" fill="#22C55E"/>
    </g>
  </g>

  <g opacity="0.85">
    <rect x="68" y="70" width="560" height="244" rx="22" fill="#020617" fill-opacity="0.48" stroke="#38BDF8" stroke-opacity="0.38"/>
    <text class="title" x="92" y="142" fill="#F8FAFC" font-family="Fira Code, Consolas, monospace" font-size="30" font-weight="700" textLength="480" lengthAdjust="spacingAndGlyphs">Hi, I'm Manish Prajapati</text>
    <text class="subtitle" x="94" y="184" fill="#67E8F9" font-family="Fira Code, Consolas, monospace" font-size="17" font-weight="600" textLength="360" lengthAdjust="spacingAndGlyphs">Aspiring AI Machine Learning</text>
    <text class="subtitle" x="94" y="212" fill="#67E8F9" font-family="Fira Code, Consolas, monospace" font-size="17" font-weight="600" textLength="300" lengthAdjust="spacingAndGlyphs">&amp; Generative AI Engineer</text>
    <text x="94" y="252" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="17" textLength="460" lengthAdjust="spacingAndGlyphs">Information Technology graduate focused on</text>
    <text x="94" y="282" fill="#CBD5E1" font-family="Inter, Arial, sans-serif" font-size="17" textLength="340" lengthAdjust="spacingAndGlyphs">Python-based intelligent systems.</text>
  </g>
</svg>
